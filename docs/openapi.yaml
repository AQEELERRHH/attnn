openapi: 3.1.0
info:
  title: Attnn. Agent API
  version: 1.0.0
  summary: Creator profiles for AI agents, paid per request with x402 (USDC on Arc).
  description: |
    Attnn. is an agentic attention marketplace on Arc mainnet: bidders put USDC into an
    on-chain escrow to reach creators, creators earn it by replying, and unanswered bids are
    refunded after 3 days.

    This API lets an AI agent read a creator's profile (bio, tags, what they're open to,
    availability, minimum bid) before deciding to bid. Each read costs $0.001 USDC, paid with
    x402 v2 through Circle Gateway (batched, gas-free for the agent) on Arc mainnet.

    How to pay: request the endpoint without payment to receive a 402 with a base64
    `PAYMENT-REQUIRED` header, then pay with Circle's `GatewayClient.pay(url)` from
    `@circle-fin/x402-batching` (chain `arc`), which deposits once into Gateway and signs each
    payment off-chain. A paid response carries a `PAYMENT-RESPONSE` header and the same receipt
    in the body. Retrying with the same payment returns the stored receipt (no second charge).

    Unknown handles return 404 before any payment is requested, so nobody pays for a miss.
    Signed-in Attnn. users read profiles for free.

    Live markets and on-chain data are also readable directly from the AttnnRegistry
    (0x024Bd6D6bdD990274Be4e99F919e7D71349782D8) and AttnnEscrow
    (0xFF00aA5414e205367aF5DD29927E23a1CCF3bAD8) contracts on Arc mainnet (chain 5042).
  contact:
    name: Attnn.
    url: https://attnn.xyz
# No API keys: access is paid per request with x402 (see the Payment-Signature header).
security: []
servers:
  - url: https://attnn.xyz
    description: Arc mainnet (real USDC)
paths:
  /api/c/{handle}:
    get:
      operationId: getCreatorProfile
      summary: Read a creator's profile (x402, $0.001 USDC on Arc)
      parameters:
        - name: handle
          in: path
          required: true
          description: The creator's Attnn. handle (case-insensitive, without @).
          schema: { type: string, example: emdee002 }
        - name: Payment-Signature
          in: header
          required: false
          description: x402 v2 payment payload (base64), as produced by Circle's GatewayClient. Omit it to receive the 402 challenge.
          schema: { type: string }
      responses:
        "200":
          description: Profile delivered (paid, or free for a signed-in Attnn. user).
          headers:
            PAYMENT-RESPONSE:
              description: Base64 JSON receipt { success, transaction, network, payer, amount } (paid requests only).
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileResponse" }
        "402":
          description: Payment required. The base64 `PAYMENT-REQUIRED` header holds the x402 v2 challenge.
          headers:
            PAYMENT-REQUIRED:
              description: |
                Base64 JSON: { x402Version: 2, resource: { url, description, mimeType },
                accepts: [{ scheme: "exact", network: "eip155:5042",
                asset: "0x3600000000000000000000000000000000000000", amount: "1000",
                payTo: <Attnn. seller address>, maxTimeoutSeconds,
                extra: { name: "GatewayWalletBatched", version: "1",
                verifyingContract: "0x77777777Dcc4d5A8B6E418Fd04D8997ef11000eE" } }] }
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: payment required }
                  price: { type: string, example: "$0.001" }
                  network: { type: string, example: "eip155:5042" }
        "400":
          description: Malformed payment, or a payment for another network.
        "404":
          description: No creator with that handle (no payment requested).
        "409":
          description: This payment was already used for a different resource.
  /api/x402/receipts:
    get:
      operationId: getX402Receipts
      summary: Public proof of x402 payments (free)
      description: Totals and the latest 20 Gateway receipts for paid profile reads.
      responses:
        "200":
          description: Receipts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  network: { type: string, example: "eip155:5042" }
                  settlement: { type: string, example: "Circle Gateway (x402 v2, GatewayWalletBatched)" }
                  totals:
                    type: object
                    properties:
                      payments: { type: integer }
                      amountUsdc: { type: string, description: Atomic USDC (6 decimals). }
                      uniquePayers: { type: integer }
                  latest:
                    type: array
                    items:
                      type: object
                      properties:
                        resource: { type: string, example: "profile:emdee002" }
                        payer: { type: string }
                        amountUsdc: { type: string, example: "1000" }
                        network: { type: string }
                        transaction: { type: string, description: Circle Gateway settlement id. }
                        at: { type: string, format: date-time }
components:
  schemas:
    ProfileResponse:
      type: object
      properties:
        handle: { type: string, example: emdee002 }
        unlocked: { type: boolean, example: true }
        payer:
          type: string
          description: Paying wallet address, or "authenticated-user" for signed-in Attnn. users.
        profile:
          type: object
          properties:
            handle: { type: string }
            bio: { type: [string, "null"] }
            tags: { type: array, items: { type: string }, example: [crypto, web3, ai, design] }
            openTo: { type: array, items: { type: string } }
            availabilityStatus: { type: string, enum: [available, limited, not_accepting] }
            minBid: { type: string, description: 'Minimum bid in atomic USDC (6 decimals); "1000000" is $1.' }
            isActive: { type: boolean, description: Market registered and active on Arc. }
            market: { type: string, description: "Path of the creator's market page on attnn.xyz (where bids are placed)." }
            verified:
              type: array
              description: >-
                Social accounts the creator proved they control by signing in with that platform.
                Proves control of the account, not real-world identity. Empty for markets that went live
                before verification existed.
              items:
                type: object
                properties:
                  provider: { type: string, enum: [x, linkedin] }
                  handle: { type: [string, "null"], description: X handle without the @; null for LinkedIn, which shares no profile URL. }
                  displayName: { type: [string, "null"] }
              example: [{ provider: x, handle: emdee002, displayName: Emdee }]
        payment:
          type: object
          description: Present on paid responses.
          properties:
            success: { type: boolean }
            transaction: { type: string, description: Circle Gateway settlement id. }
            network: { type: string, example: "eip155:5042" }
            payer: { type: string }
            amount: { type: string, example: "1000" }
            replay: { type: boolean, description: True when this payment was already settled and the stored receipt is returned. }
