[profile.default]
via_ir = true
src = "src"
out = "out"
libs = ["lib", "node_modules"]
solc = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

[profile.default.fmt]
number_underscore = "thousands"
multiline_func_header = "all"

[rpc_endpoints]
arc_testnet = "https://arc-testnet.drpc.org"
arc_read = "https://rpc.testnet.arc.network"

[etherscan]
arc_testnet = { key = "", url = "https://testnet.arcscan.app" }

# See more config options: https://book.getfoundry.sh/reference/config/